name: Daily AI repo radar

on:
  schedule:
    # GitHub starts scheduled runs late (Oct 22 to Nov 4 2026 the 08:30 run
    # landed 4 to 10 hours late, after the 10:45 UTC morning research had
    # already read yesterday's list). So start much earlier, just after
    # midnight UTC, with backups through the night. The guard step below
    # makes every later run do nothing once today's list exists.
    - cron: "7 0 * * *"
    - cron: "41 1 * * *"
    - cron: "13 3 * * *"
    - cron: "37 4 * * *"
    - cron: "11 6 * * *"
    - cron: "30 8 * * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab
  push:
    # Run straight away when the script or this file changes, so a broken
    # edit shows up the same day instead of at the next 3:30 am run.
    branches: [main]
    paths: [radar.py, .github/workflows/radar.yml]

permissions:
  contents: write
  issues: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Skip if today's list already exists
        id: fresh
        run: |
          if head -1 data/trending.md 2>/dev/null | grep -q "$(date -u +%F)"; then
            echo "Today's list is already there; nothing to do."
            echo "done=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.fresh.outputs.done != '1'
        with:
          python-version: "3.12"

      - name: Build today's list
        if: steps.fresh.outputs.done != '1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python radar.py

      - name: Save the results
        if: steps.fresh.outputs.done != '1'
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Radar $(date -u +%F)" || echo "Nothing changed"
          git pull --rebase
          git push

      # If any step failed, open an issue: GitHub emails you, and the morning
      # report can name the cause instead of just "stale".
      - name: Report a failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Radar failed $(date -u +%F)"
          if gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq length | grep -qv '^0$'; then
            echo "Issue for today already open."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
